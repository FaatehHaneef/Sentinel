<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sentinel cover</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        font-variant-ligatures: none;
      }
      body {
        width: 1500px;
        height: 1000px;
        overflow: hidden;
        background: #12152a;
        font-family: "Pixelify Sans", monospace;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 70%;
        image-rendering: pixelated;
        filter: blur(3px) brightness(0.85);
        transform: scale(1.04);
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 45% at 50% 72%, rgba(255, 179, 71, 0.28), transparent 70%),
          linear-gradient(180deg, rgba(18, 21, 42, 0.55) 0%, transparent 40%);
      }

      /* The phone camera around the selfie. */
      .phone {
        position: absolute;
        inset: 22px;
        border: 14px solid #12152a;
        box-shadow:
          0 0 0 6px #2e3a5c,
          inset 0 0 0 4px #2e3a5c;
        border-radius: 46px;
      }
      .status {
        position: absolute;
        top: 46px;
        left: 84px;
        right: 84px;
        display: flex;
        justify-content: space-between;
        color: #f3e9d2;
        font-size: 26px;
      }
      .battery {
        display: inline-block;
        width: 46px;
        height: 22px;
        border: 3px solid #f3e9d2;
        position: relative;
        vertical-align: -3px;
        margin-left: 10px;
      }
      .battery::after {
        content: "";
        position: absolute;
        inset: 3px 12px 3px 3px;
        background: #6fae75;
      }
      .bracket {
        position: absolute;
        width: 70px;
        height: 70px;
        border: 6px solid rgba(243, 233, 210, 0.8);
      }
      .bracket.tl {
        top: 230px;
        left: 120px;
        border-right: 0;
        border-bottom: 0;
      }
      .bracket.tr {
        top: 230px;
        right: 120px;
        border-left: 0;
        border-bottom: 0;
      }
      .shutter {
        position: absolute;
        bottom: 58px;
        right: 92px;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        border: 6px solid #f3e9d2;
        box-shadow: inset 0 0 0 6px rgba(18, 21, 42, 0.6);
        background: rgba(243, 233, 210, 0.9);
      }

      .title {
        position: absolute;
        top: 92px;
        width: 100%;
        text-align: center;
      }
      .title h1 {
        font-size: 150px;
        font-weight: 700;
        line-height: 1;
        color: #f3e9d2;
        text-shadow:
          8px 8px 0 #e8743b,
          16px 16px 0 #12152a;
        letter-spacing: 4px;
      }
      .title p {
        margin-top: 18px;
        font-size: 30px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #ffb347;
        text-shadow: 3px 3px 0 #12152a;
      }

      /* The shoppers, crowded in, two rows, leaning towards the camera. */
      .crowd canvas {
        position: absolute;
        image-rendering: pixelated;
        filter: drop-shadow(6px 6px 0 rgba(9, 10, 21, 0.55));
      }

      .note {
        position: absolute;
        left: 92px;
        bottom: 96px;
        width: 300px;
        padding: 26px 24px 22px;
        background: #ffe9a8;
        color: #3a2a20;
        transform: rotate(-6deg);
        box-shadow: 8px 8px 0 rgba(9, 10, 21, 0.6);
        font-size: 40px;
        line-height: 1.05;
        font-weight: 700;
      }
      .note::before {
        content: "";
        position: absolute;
        top: -14px;
        left: 50%;
        width: 90px;
        height: 28px;
        margin-left: -45px;
        background: rgba(143, 163, 191, 0.75);
        transform: rotate(3deg);
      }
      .note small {
        display: block;
        margin-top: 10px;
        font-family: "Atkinson Hyperlegible", sans-serif;
        font-size: 22px;
        color: #a0522d;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <img class="backdrop" src="../assets/banner.png" alt="" />
      <div class="glow"></div>

      <div class="crowd">
        <!-- Back row, a little further from the camera. -->
        <canvas data-who="tobin" data-scale="11" style="left: 352px; top: 404px"></canvas>
        <canvas
          data-who="pell"
          data-scale="11"
          data-flip="1"
          style="left: 548px; top: 396px"
        ></canvas>
        <canvas data-who="knock" data-scale="11" style="left: 760px; top: 400px"></canvas>
        <canvas
          data-who="echo"
          data-scale="11"
          data-flip="1"
          style="left: 960px; top: 408px"
        ></canvas>
        <!-- Front row, close to the camera. -->
        <canvas data-who="cog" data-scale="14" style="left: 418px; top: 560px"></canvas>
        <canvas data-who="iris" data-scale="15" style="left: 630px; top: 546px"></canvas>
        <canvas
          data-who="dash"
          data-scale="14"
          data-flip="1"
          style="left: 862px; top: 560px"
        ></canvas>
      </div>

      <div class="title">
        <h1>SENTINEL</h1>
        <p>The Checkout Trials</p>
      </div>

      <div class="phone"></div>
      <div class="status">
        <span>9:41</span>
        <span>REC ●<span class="battery"></span></span>
      </div>
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="shutter"></div>

      <div class="note">
        make it accessible!
        <small>love, the shoppers</small>
      </div>
    </div>
    <script src="cover.js"></script>
  </body>
</html>
